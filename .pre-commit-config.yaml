repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: markdownlint
        name: Markdownlint
        entry: pnpm exec markdownlint
        language: system
        files: \.md$
        exclude: ^(node_modules/|\.github/)
        pass_filenames: true
        stages: [pre-commit]

      - id: pytest
        name: Pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: yamllint
        name: YAML lint
        entry: uv run yamllint
        language: system
        files: \.(yml|yaml)$
        exclude: ^node_modules/
        pass_filenames: true
        stages: [pre-commit]
