name: Claude Code Review

# Automatically review pull requests with Claude when they are opened or marked
# ready for review. Authentication uses a Claude subscription OAuth token stored
# in the CLAUDE_CODE_OAUTH_TOKEN repository secret, so reviews draw on the
# existing Claude plan rather than a separate Anthropic API key.
on:
  pull_request:
    types: [opened, ready_for_review]

# Cancel an in-progress review when the same pull request triggers another run,
# so a single PR never consumes subscription quota on overlapping reviews.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip draft pull requests; they are reviewed once marked ready for review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      checks: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
