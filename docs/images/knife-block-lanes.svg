<svg viewBox="0 0 1040 650" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Knife blade block lane geometry: alternating handles, lane pitch, and the generated block</title>
<desc>A labelled plan view of four knife lanes (the default block has seven; four are shown for
clarity). Knives alternate head-to-toe, so handles fall to opposite ends and each blade passes fully
through a single central block. Because a handle is wider than the lane pitch, two same-end handles
sit two lanes apart, clearing each other by handle_gap_mm. Only the central block is generated; the
handle-rest zones at each end are generic gridfinity_build123d blanks, not generated by this
project.</desc>
<style>
  .lbl { font-family: system-ui, sans-serif; font-size: 15px; fill: var(--foreground, #1f2328); }
  .lbl-sm { font-family: system-ui, sans-serif; font-size: 13px; fill: var(--muted-foreground, #6b7280); }
  .lbl-part { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--primary, #2563eb); }
  .lbl-on-dark { font-family: system-ui, sans-serif; font-size: 13px; fill: #f3f4f6; }
  .dim { stroke: var(--muted-foreground, #6b7280); stroke-width: 1.5; }
  .profile { fill: var(--primary, #2563eb); fill-opacity: 0.16; stroke: var(--primary, #2563eb); stroke-width: 2.5; }
  .blank { fill: var(--border, #9ca3af); fill-opacity: 0.18; }
  .blade { fill: var(--muted-foreground, #6b7280); fill-opacity: 0.55; stroke: var(--foreground, #1f2328); stroke-width: 1.5; }
  .handle { fill: var(--foreground, #1f2328); fill-opacity: 0.85; }
  .gridline { stroke: var(--destructive, #dc2626); stroke-width: 2; stroke-dasharray: 6 5; }
</style>

<!-- Blank zones (generic gridfinity_build123d blanks; not generated by this project) -->
<rect x="60" y="10" width="340" height="510" class="blank"/>
<rect x="600" y="10" width="340" height="510" class="blank"/>
<text x="70" y="548" class="lbl-sm">blank (gridfinity_build123d, not generated)</text>
<text x="610" y="548" class="lbl-sm">blank (gridfinity_build123d, not generated)</text>

<!-- The generated block, centred, spanning all lanes -->
<rect x="400" y="10" width="200" height="510" class="profile"/>
<text x="420" y="35" class="lbl-part">block (generated)</text>

<!-- Lane 1: handle left. Blade rect starts exactly where the handle rect ends (x=280): no gap. -->
<rect x="280" y="89" width="660" height="22" class="blade"/>
<rect x="60" y="20" width="220" height="160" rx="18" class="handle"/>
<text x="75" y="48" class="lbl-on-dark">handle_width_mm</text>

<!-- Lane 2: handle right. Blade rect ends exactly where the handle rect begins (x=720): no gap. -->
<rect x="60" y="199" width="660" height="22" class="blade"/>
<rect x="720" y="130" width="220" height="160" rx="18" class="handle"/>

<!-- Lane 3: handle left -->
<rect x="280" y="309" width="660" height="22" class="blade"/>
<rect x="60" y="240" width="220" height="160" rx="18" class="handle"/>

<!-- Lane 4: handle right -->
<rect x="60" y="419" width="660" height="22" class="blade"/>
<rect x="720" y="350" width="220" height="160" rx="18" class="handle"/>

<text x="950" y="105" class="lbl-sm">lane 1</text>
<text x="950" y="215" class="lbl-sm">lane 2</text>
<text x="950" y="325" class="lbl-sm">lane 3</text>
<text x="950" y="435" class="lbl-sm">lane 4</text>

<!-- lane_pitch: centre-to-centre distance between adjacent lanes -->
<line x1="25" y1="100" x2="50" y2="100" class="dim"/>
<line x1="25" y1="210" x2="50" y2="210" class="dim"/>
<line x1="25" y1="100" x2="25" y2="210" class="dim"/>
<text x="15" y="155" class="lbl-part" text-anchor="middle" transform="rotate(-90, 15, 155)">lane_pitch_mm</text>

<!-- handle_gap: clearance between two same-end (left) handles, two lanes apart -->
<line x1="330" y1="180" x2="374" y2="180" class="gridline"/>
<line x1="330" y1="240" x2="374" y2="240" class="gridline"/>
<line x1="352" y1="180" x2="352" y2="240" class="gridline"/>

<text x="60" y="575" class="lbl">Each dark handle is drawn to its own handle_width_mm, wider than one lane -- so two same-end</text>
<text x="60" y="595" class="lbl">handles land two lanes apart, clearing each other by handle_gap_mm (dashed red, above):</text>
<text x="60" y="615" class="lbl" fill="var(--destructive,#dc2626)">lane_pitch_mm = (handle_width_mm + handle_gap_mm) / 2 -- half of what one lane alone would need.</text>

</svg>
