schema: spec-driven

context: |
  Project: count-spatula
  Domain: parametric 3D model generator for Gridfinity-compatible kitchen bins.
  Primary output: STL and 3MF files for 3D printing, including curated preset artifacts for releases.

  Tech stack:
  - Python 3.13
  - Dependency manager: uv
  - 3D geometry libraries: build123d, gridfinity-build123d
  - Testing: pytest
  - Linting: ruff
  - Notebook prototyping: Jupyter

  Repository structure intent:
  - cutlery_bin.py is the source of truth for all model geometry behavior. It defines BinParameters,
    KitchenBin, CutleryBin, the named presets, and the print-bed check.
  - main.py is the CLI layer: it parses arguments into BinParameters, exports STL or 3MF, and returns
    process exit codes.
  - render_models.py generates the README render set.
  - notebooks/ are proof-of-concept and exploration, not the supported public interface.
  - tests/ should validate geometry behavior, option handling, and export behavior. Tests are linked to
    spec scenarios with @pytest.mark.scenario("<capability>", "<scenario name>"); a guard fails when a
    scenario has no claiming test, so specs and tests must move together.
  - UAT.md lists the cases to regenerate and eyeball in a slicer before archiving a change.

  Product and requirements approach:
  - Frame work as epics and user stories.
  - Use clear story format: As a <user>, I want <capability>, so that <benefit>.
  - Keep each change scoped to one story or a tightly related story set.

  Quality and delivery approach:
  - Use TDD-oriented acceptance criteria and scenario-driven thinking.
  - Prefer executable scenarios and explicit traceability from story to tests.
  - Prioritize behavior clarity and test coverage visibility.

  Collaboration and workflow conventions:
  - One discrete change per branch.
  - Branch naming: feature/<slug>, fix/<slug>, docs/<slug>, refactor/<slug>, chore/<slug>.
  - Raise PR after branch work is complete and wait for user review/approval before merge.
  - Any PR containing AI-generated code must disclose the coding agent and model used.

  Style and coding conventions:
  - Use LF line endings and UTF-8 encoding.
  - Use LF as a line terminator; non-empty text files should end with a newline.
  - Do not use trailing whitespace, except one trailing space in Markdown when intentionally used for a line break.
  - Use spaces only for indentation; 4 spaces per level in Python.
  - Use 2 spaces per indentation level in YAML and JSON files.
  - Keep line length to 120 characters.
  - Comments should be grammatically correct sentences.
  - Use Unix-style forward-slash paths in code and documentation.
  - Prefer Markdown with .md extension for documentation files.

  Installation and running:
  - Install dependencies with: uv sync (dev tools live in the [dependency-groups] dev group, so the
    optional-extras form does not install them).
  - Run the generator with: uv run python main.py
  - Running main.py with no arguments generates kitchen_bin_2x4_h56.stl in the repository root; the default
    filename is derived from the parameters and the selected format.
  - Run a named preset with: uv run python main.py --preset chop-board
  - Validate OpenSpec YAML syntax with: uv run python -c "import pathlib, yaml; yaml.safe_load(pathlib.Path('openspec/config.yaml').read_text(encoding='utf-8'))"
  - Run the OpenSpec CLI with: pnpm exec openspec --help
  - Run lint checks with: uv run ruff check .
  - Run tests with: uv run pytest; skip the slow real-geometry builds with: uv run pytest -m "not slow"
  - Pre-commit hooks run ruff, markdownlint, and yamllint on commit, and pytest on push. Install them with:
    uv run pre-commit install
  - For 3D model viewing in VS Code, use ocp-vscode; show_all() in main.py displays the model.

rules:
  proposal:
    - Include sections for Epic, User Stories, Acceptance Criteria, Non-goals, and Test Strategy.
    - "Use User Story format: As a <user>, I want <capability>, so that <benefit>."
    - Express acceptance criteria as scenario-style statements, preferably Given/When/Then.
    - Make scope boundaries explicit so proposals stay implementable on a single branch.

  design:
    - Map each major design decision to at least one acceptance criterion.
    - Identify how design choices preserve existing default geometry behavior.
    - Call out compatibility risks for CLI usage, export flow, and future v1.0 packaging.

  tasks:
    - Include test tasks for each story before or alongside implementation tasks.
    - Map tasks to acceptance criteria so coverage is visible.
    - Keep tasks small, concrete, and independently verifiable.
    - Include lint/test verification tasks before marking work complete.
