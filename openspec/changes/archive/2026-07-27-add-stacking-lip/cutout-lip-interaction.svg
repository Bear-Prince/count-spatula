<svg viewBox="0 0 775 476" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Stacking lip and side cutout interaction</title>
<desc>Two side-on cross-sections through a chop-board bin's long wall, at one end of the side cutout.
Panel A shows the correct result: the cutout's 10 mm filleted flare reaches its widest exactly at the
wall top, giving a 106.2 mm full opening, and the stacking lip above it is cut off in a clean vertical
face at that same widest point, plus or minus 53.1 mm from the cutout centre. Panel B shows what
happens if the cutout height is simply raised, as design Decision 2 currently describes: the flare
migrates upward into the lip band, so the opening at the wall top narrows to 89.3 mm, 17.0 mm less,
and the lip rather than the wall carries the curve.</desc>
<style>
  text { font-family: system-ui, -apple-system, sans-serif; }
  .h1 { font-size: 19px; font-weight: 600; fill: var(--foreground, #1f2328); }
  .ptitle { font-size: 16px; font-weight: 600; fill: var(--foreground, #1f2328); }
  .lbl-sm { font-size: 12.5px; fill: var(--muted-foreground, #6b7280); }
  .lbl-dim { font-size: 13px; font-weight: 600; fill: var(--foreground, #1f2328); }
  .lbl-note { font-size: 12.5px; font-weight: 600; fill: var(--foreground, #1f2328); }
  .lbl-lip { font-size: 12.5px; font-weight: 600; fill: #7d430f; }
  .wall { fill: var(--muted, #d8dbe0); stroke: var(--foreground, #57606a); stroke-width: 1.6; }
  .lip { fill: #e0953f; stroke: #8a4b12; stroke-width: 1.6; }
  .ref { stroke: var(--muted-foreground, #6b7280); stroke-width: 1; stroke-dasharray: 5 4; }
  .tick { stroke: var(--foreground, #57606a); stroke-width: 1.8; }
  .caption { font-size: 13px; fill: var(--muted-foreground, #6b7280); }
  @media (prefers-color-scheme: dark) {
    .h1, .ptitle, .lbl-dim, .lbl-note { fill: #e8eaed; }
    .lbl-sm, .caption { fill: #94a0ac; }
    .wall { fill: #363c45; stroke: #9aa4b0; }
    .ref { stroke: #94a0ac; }
    .tick { stroke: #c8d0d8; }
    .lbl-lip { fill: #f0b168; }
  }
</style>
<text class="h1" x="30" y="36">Where the stacking lip stops at a side cutout</text>
<text class="caption" x="30" y="58">Section through a chop-board bin's long wall, at one end of the cutout. Curves sampled from built geometry.</text>
<text class="ptitle" x="66" y="84">A &#8212; Correct</text>
<text class="lbl-sm" x="66" y="103">flare reaches the wall top; lip cut vertically at the rim</text>
