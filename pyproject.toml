[project]
name = "count-spatula"
version = "0.1.0"
description = "Parametric generator for Gridfinity-compatible kitchen and cutlery bins."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    # Pin build123d exactly: the bin geometry depends on subtle build123d behaviour
    # (e.g. what BuildSketch.faces() returns), so an unpinned upgrade can silently
    # change or break the generated model.
    "build123d==0.9.0",
    "gridfinity-build123d",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "ocp-vscode>=3.0.1",
    "pyyaml>=6.0.2",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
    "taplo>=0.9.3",
    "isort>=8.0.1",
    "pre-commit>=4.6.0",
    "yamllint>=1.38.0",
]

[tool.uv.sources]
# Pin to a specific commit so the geometry dependency cannot drift unnoticed. The repo is public,
# so HTTPS lets local checkouts and CI clone it anonymously with no SSH key. We install from our
# fork of Ruudjhuu/gridfinity_build123d (same commit hashes) so builds do not depend on the
# upstream repo staying available; the fork is a plain mirror and must not diverge from upstream.
gridfinity-build123d = { git = "https://github.com/Bear-Prince/gridfinity_build123d", rev = "261f4550ba26c3be58eca4f8abdc9e112a30d396" }

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--strict-markers"
markers = [
    "scenario(capability, name): links the test to an OpenSpec scenario in openspec/specs/<capability>/spec.md",
    "slow: builds real geometry; deselect for a fast run with -m 'not slow'",
]
filterwarnings = [
    # The ezdxf dependency (via build123d) uses deprecated pyparsing APIs; the noise is not ours to fix.
    "ignore::DeprecationWarning:ezdxf.queryparser",
]

[tool.coverage.run]
source = ["cutlery_bin", "knife_block", "main"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1

[tool.ruff]
line-length = 120
extend-exclude = [
    "notebooks/*.ipynb",
    "openspec/changes/**/*.md",
]

[tool.ruff.lint]
select = [
    "ANN",    # Catch missing type annotations
    "ARG",    # Flag unused arguments
    "B",      # Highlight common bugs in python
    "BLE",    # Disallow catch-all exceptions
    "C4",     # Catch incorrect use of comprehensions, dict, list, etc
    "E",      # General pycodestyle errors
    "F",      # Use pyflakes
    "FAST",   # FastAPI linting rules
    "FURB",   # Code modernization and anti-pattern lints
    "I",      # Use isort for imports
    "ICN",    # Follow flake8 import conventions
    "ISC",    # Catch implicit string concatenation mistakes
    "LOG",    # Catch invalid logging
    "N",      # Use pep8 naming
    "PD",     # Follow pandas conventions
    "PERF",   # Performance-focused lints
    "PIE",    # Miscellaneous lints
    "PLC",    # Pylint conventions
    "PTH",    # Use pathlib instead of os.path
    "Q",      # String quoting consistency
    "RET",    # Return statement good practice
    "RSE",    # Unnecessary parens on raise
    "RUF",    # Ruff-specific lints
    "SIM",    # Common simplification rules
    "TID",    # Flake8 tidy imports
    "UP",     # Code modernization
    "W",      # pycodestyle warnings
]
