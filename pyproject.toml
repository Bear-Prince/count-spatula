[project]
name = "count-spatula"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gridfinity-build123d",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "ocp-vscode>=3.0.1",
    "pytest>=9.0.2",
    "ruff>=0.14.11",
]

[tool.uv.sources]
gridfinity-build123d = { git = "ssh://git@github.com/Ruudjhuu/gridfinity_build123d" }

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
pythonpath = "."